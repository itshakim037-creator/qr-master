<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">

<title>QR Master - Smart QR Code Generator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali","Noto Sans",sans-serif;
}

body{
  background:#f5f7fb;
  color:#182033;
  min-height:100vh;
  transition:.25s;
}

body.dark{
  background:#0b1020;
  color:#f8fafc;
}

.app{
  width:100%;
  max-width:540px;
  margin:auto;
  min-height:100vh;
  padding-bottom:35px;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#4834d4);
  color:white;
  padding:22px 18px 28px;
  border-radius:0 0 30px 30px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:50px;
  height:50px;
  border-radius:15px;
  background:white;
  color:#6c5ce7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

.brand h1{
  font-size:23px;
}

.brand p{
  font-size:12px;
  opacity:.85;
  margin-top:3px;
}

.theme{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  color:white;
  font-size:20px;
  cursor:pointer;
}

.intro{
  margin-top:20px;
}

.intro h2{
  font-size:24px;
}

.intro p{
  margin-top:6px;
  font-size:13px;
  opacity:.85;
}

.content{
  padding:18px 15px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:15px;
}

.tab{
  border:0;
  padding:12px 4px;
  border-radius:12px;
  background:white;
  color:#4b5563;
  font-size:12px;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.dark .tab{
  background:#172036;
  color:#cbd5e1;
}

.tab.active{
  background:#6c5ce7;
  color:white;
}

.panel{
  background:white;
  border-radius:22px;
  padding:18px;
  box-shadow:0 6px 22px rgba(0,0,0,.07);
}

.dark .panel{
  background:#151d32;
  box-shadow:none;
}

.type{
  display:none;
}

.type.active{
  display:block;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #dce2ec;
  border-radius:12px;
  padding:13px;
  margin-bottom:13px;
  outline:none;
  background:#fafbfe;
  color:#182033;
  font-size:14px;
}

textarea{
  min-height:105px;
  resize:vertical;
}

.dark input,
.dark textarea,
.dark select{
  background:#0f172a;
  color:white;
  border-color:#334155;
}

.color-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.color-box{
  display:flex;
  align-items:center;
  gap:8px;
}

.color-box input[type="color"]{
  width:55px;
  height:43px;
  padding:3px;
  margin:0;
}

.generate{
  width:100%;
  border:0;
  padding:15px;
  border-radius:13px;
  background:linear-gradient(135deg,#6c5ce7,#4834d4);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:4px;
}

.generate:disabled{
  opacity:.65;
}

.qr-card{
  display:none;
  margin-top:16px;
  background:white;
  border-radius:22px;
  padding:20px;
  text-align:center;
  box-shadow:0 6px 22px rgba(0,0,0,.07);
}

.dark .qr-card{
  background:#151d32;
}

.qr-card.show{
  display:block;
}

.qr-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:14px;
}

#qrcode{
  width:260px;
  height:260px;
  margin:auto;
  padding:15px;
  background:white;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

#qrcode canvas{
  display:block;
  max-width:100%;
  max-height:100%;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.action{
  border:0;
  padding:12px;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer;
  background:#eef2ff;
  color:#4c1d95;
}

.dark .action{
  background:#252f49;
  color:#ddd6fe;
}

.action:active,
.generate:active{
  transform:scale(.98);
}

.history{
  margin-top:20px;
}

.history-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.history-head h2{
  font-size:18px;
}

.clear{
  border:0;
  background:#fee2e2;
  color:#dc2626;
  padding:8px 11px;
  border-radius:9px;
  font-size:12px;
  cursor:pointer;
}

.history-item{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.dark .history-item{
  background:#151d32;
}

.history-text{
  max-width:78%;
  overflow:hidden;
}

.history-type{
  font-weight:bold;
  font-size:13px;
}

.history-value{
  color:#64748b;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:3px;
}

.delete{
  border:0;
  background:none;
  color:#ef4444;
  font-size:17px;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:25px;
  color:#94a3b8;
  background:white;
  border-radius:14px;
}

.dark .empty{
  background:#151d32;
}

.footer{
  text-align:center;
  color:#94a3b8;
  font-size:11px;
  margin-top:25px;
  line-height:1.6;
}

.loader{
  display:none;
  margin:10px auto;
  width:25px;
  height:25px;
  border:3px solid #ddd6fe;
  border-top-color:#6c5ce7;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(80px);
  background:#111827;
  color:white;
  padding:12px 18px;
  border-radius:30px;
  font-size:13px;
  opacity:0;
  transition:.3s;
  z-index:9999;
  pointer-events:none;
  max-width:90%;
  text-align:center;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

@media(max-width:360px){
  .tabs{
    grid-template-columns:repeat(2,1fr);
  }

  #qrcode{
    width:235px;
    height:235px;
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="top">

    <div class="brand">

      <div class="logo">▦</div>

      <div>
        <h1>QR Master</h1>
        <p>Smart QR Code Generator</p>
      </div>

    </div>

    <button class="theme" onclick="toggleTheme()" id="themeBtn">
      🌙
    </button>

  </div>

  <div class="intro">
    <h2>আপনার QR Code তৈরি করুন</h2>
    <p>দ্রুত, সহজ এবং সুন্দরভাবে</p>
  </div>

</header>


<main class="content">

<div class="tabs">

  <button class="tab active" onclick="selectType('url',this)">
    🔗 Website
  </button>

  <button class="tab" onclick="selectType('text',this)">
    📝 Text
  </button>

  <button class="tab" onclick="selectType('phone',this)">
    📞 Phone
  </button>

  <button class="tab" onclick="selectType('email',this)">
    ✉️ Email
  </button>

  <button class="tab" onclick="selectType('wifi',this)">
    📶 Wi-Fi
  </button>

  <button class="tab" onclick="selectType('contact',this)">
    👤 Contact
  </button>

  <button class="tab" onclick="selectType('sms',this)">
    💬 SMS
  </button>

  <button class="tab" onclick="selectType('whatsapp',this)">
    🟢 WhatsApp
  </button>

  <button class="tab" onclick="selectType('location',this)">
    📍 Location
  </button>

</div>


<div class="panel">

<!-- WEBSITE -->

<div class="type active" id="url">

<label>Website URL</label>

<input
 id="urlInput"
 type="url"
 placeholder="https://example.com">

</div>


<!-- TEXT -->

<div class="type" id="text">

<label>Your Text</label>

<textarea
 id="textInput"
 placeholder="আপনার লেখা এখানে লিখুন..."></textarea>

</div>


<!-- PHONE -->

<div class="type" id="phone">

<label>Phone Number</label>

<input
 id="phoneInput"
 type="tel"
 placeholder="+8801XXXXXXXXX">

</div>


<!-- EMAIL -->

<div class="type" id="email">

<label>Email Address</label>

<input
 id="emailInput"
 type="email"
 placeholder="example@email.com">

<label>Subject</label>

<input
 id="emailSubject"
 type="text"
 placeholder="Email subject">

<label>Message</label>

<textarea
 id="emailMessage"
 placeholder="Email message"></textarea>

</div>


<!-- WIFI -->

<div class="type" id="wifi">

<label>Wi-Fi Name / SSID</label>

<input
 id="wifiName"
 type="text"
 placeholder="Wi-Fi name">

<label>Wi-Fi Password</label>

<input
 id="wifiPassword"
 type="text"
 placeholder="Wi-Fi password">

<label>Security</label>

<select id="wifiSecurity">

<option value="WPA">WPA/WPA2</option>
<option value="WEP">WEP</option>
<option value="nopass">No Password</option>

</select>

<label style="font-weight:normal">

<input
 id="wifiHidden"
 type="checkbox"
 style="width:auto;margin:0 5px 0 0">

Hidden Network

</label>

</div>


<!-- CONTACT -->

<div class="type" id="contact">

<label>Full Name</label>

<input
 id="contactName"
 type="text"
 placeholder="আপনার নাম / Your Name">

<label>Phone</label>

<input
 id="contactPhone"
 type="tel"
 placeholder="+8801XXXXXXXXX">

<label>Email</label>

<input
 id="contactEmail"
 type="email"
 placeholder="example@email.com">

<label>Organization</label>

<input
 id="contactOrg"
 type="text"
 placeholder="প্রতিষ্ঠানের নাম / Organization">

</div>


<!-- SMS -->

<div class="type" id="sms">

<label>Phone Number</label>

<input
 id="smsPhone"
 type="tel"
 placeholder="+8801XXXXXXXXX">

<label>Message</label>

<textarea
 id="smsMessage"
 placeholder="আপনার SMS লিখুন..."></textarea>

</div>


<!-- WHATSAPP -->

<div class="type" id="whatsapp">

<label>WhatsApp Number</label>

<input
 id="whatsappPhone"
 type="tel"
 placeholder="8801XXXXXXXXX">

<label>Message</label>

<textarea
 id="whatsappMessage"
 placeholder="WhatsApp message লিখুন..."></textarea>

</div>


<!-- LOCATION -->

<div class="type" id="location">

<label>Latitude</label>

<input
 id="latitude"
 type="text"
 placeholder="23.8103">

<label>Longitude</label>

<input
 id="longitude"
 type="text"
 placeholder="90.4125">

<p style="font-size:11px;color:#64748b;margin-bottom:13px">
উদাহরণ: Dhaka = 23.8103, 90.4125
</p>

</div>


<!-- QR OPTIONS -->

<label style="margin-top:4px">
QR Code Options
</label>

<div class="color-row">

<div class="color-box">

<label style="margin:0;font-size:12px">
Dark
</label>

<input
 id="darkColor"
 type="color"
 value="#111827">

</div>

<div class="color-box">

<label style="margin:0;font-size:12px">
Light
</label>

<input
 id="lightColor"
 type="color"
 value="#ffffff">

</div>

</div>


<label>QR Size</label>

<select id="qrSize">

<option value="210">Small</option>
<option value="260" selected>Medium</option>
<option value="320">Large</option>

</select>


<div class="loader" id="loader"></div>


<button
 class="generate"
 id="generateBtn"
 onclick="generateQR()">

✨ Generate QR Code

</button>

</div>


<!-- RESULT -->

<div class="qr-card" id="qrCard">

<div class="qr-title">
Your QR Code
</div>

<div id="qrcode"></div>

<div class="actions">

<button class="action" onclick="downloadQR()">
⬇️ Download
</button>

<button class="action" onclick="shareQR()">
📤 Share
</button>

<button class="action" onclick="copyQRText()">
📋 Copy
</button>

<button class="action" onclick="generateQR()">
🔄 Refresh
</button>

</div>

</div>


<!-- HISTORY -->

<div class="history">

<div class="history-head">

<h2>📜 Recent QR</h2>

<button class="clear" onclick="clearHistory()">
Clear
</button>

</div>

<div id="historyList"></div>

</div>


<div class="footer">

QR Master © 2026

<br>

Create • Save • Share QR Codes

</div>

</main>

</div>


<div class="toast" id="toast"></div>


<!-- QR LIBRARY -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

let currentType="url";
let currentQRText="";
let currentSize=260;

let history=JSON.parse(
 localStorage.getItem("qrMasterHistory") || "[]"
);


/* TYPE */

function selectType(type,button){

 currentType=type;

 document.querySelectorAll(".type")
 .forEach(function(el){
   el.classList.remove("active");
 });

 document.getElementById(type)
 .classList.add("active");

 document.querySelectorAll(".tab")
 .forEach(function(el){
   el.classList.remove("active");
 });

 button.classList.add("active");

}


/* WIFI ESCAPE */

function escapeWifi(value){

 return String(value)
 .replace(/\\/g,"\\\\")
 .replace(/;/g,"\\;")
 .replace(/,/g,"\\,")
 .replace(/:/g,"\\:");

}


/* GET DATA */

function getQRText(){

 if(currentType==="url"){

   let value=document
   .getElementById("urlInput")
   .value.trim();

   if(!value){
     showToast("Website URL লিখুন");
     return null;
   }

   if(
     !value.startsWith("http://") &&
     !value.startsWith("https://")
   ){
     value="https://"+value;
   }

   return value;
 }


 if(currentType==="text"){

   let value=document
   .getElementById("textInput")
   .value.trim();

   if(!value){
     showToast("Text লিখুন");
     return null;
   }

   return value;
 }


 if(currentType==="phone"){

   let value=document
   .getElementById("phoneInput")
   .value.trim();

   if(!value){
     showToast("Phone number লিখুন");
     return null;
   }

   return "tel:"+value;
 }


 if(currentType==="email"){

   let email=document
   .getElementById("emailInput")
   .value.trim();

   let subject=document
   .getElementById("emailSubject")
   .value.trim();

   let message=document
   .getElementById("emailMessage")
   .value.trim();

   if(!email){
     showToast("Email address লিখুন");
     return null;
   }

   return "mailto:"+email+
   "?subject="+encodeURIComponent(subject)+
   "&body="+encodeURIComponent(message);
 }


 if(currentType==="wifi"){

   let ssid=document
   .getElementById("wifiName")
   .value.trim();

   let password=document
   .getElementById("wifiPassword")
   .value;

   let security=document
   .getElementById("wifiSecurity")
   .value;

   let hidden=document
   .getElementById("wifiHidden")
   .checked;

   if(!ssid){
     showToast("Wi-Fi name লিখুন");
     return null;
   }

   return "WIFI:"+
   "T:"+security+
   ";S:"+escapeWifi(ssid)+
   ";P:"+escapeWifi(password)+
   ";H:"+(hidden?"true":"false")+
   ";;";
 }


 /* CONTACT */

 if(currentType==="contact"){

   let name=document
   .getElementById("contactName")
   .value.trim();

   let phone=document
   .getElementById("contactPhone")
   .value.trim();

   let email=document
   .getElementById("contactEmail")
   .value.trim();

   let org=document
   .getElementById("contactOrg")
   .value.trim();

   if(!name && !phone && !email){

     showToast("Contact information দিন");

     return null;
   }

   /*
    বাংলা/ইংরেজি Contact
    UTF-8 support
   */

   return (
     "BEGIN:VCARD\r\n"+
     "VERSION:3.0\r\n"+
     "CHARSET=UTF-8\r\n"+
     "FN;CHARSET=UTF-8:"+name+"\r\n"+
     "N;CHARSET=UTF-8:"+name+";;;;\r\n"+
     "TEL:"+phone+"\r\n"+
     "EMAIL:"+email+"\r\n"+
     "ORG;CHARSET=UTF-8:"+org+"\r\n"+
     "END:VCARD"
   );
 }


 /* SMS */

 if(currentType==="sms"){

   let phone=document
   .getElementById("smsPhone")
   .value.trim();

   let message=document
   .getElementById("smsMessage")
   .value.trim();

   if(!phone){
     showToast("Phone number লিখুন");
     return null;
   }

   return "SMSTO:"+phone+":"+message;
 }


 /* WHATSAPP */

 if(currentType==="whatsapp"){

   let phone=document
   .getElementById("whatsappPhone")
   .value.trim();

   let message=document
   .getElementById("whatsappMessage")
   .value.trim();

   if(!phone){
     showToast("WhatsApp number লিখুন");
     return null;
   }

   phone=phone.replace(/[^\d]/g,"");

   return "https://wa.me/"+phone+
   "?text="+encodeURIComponent(message);
 }


 /* LOCATION */

 if(currentType==="location"){

   let lat=document
   .getElementById("latitude")
   .value.trim();

   let lon=document
   .getElementById("longitude")
   .value.trim();

   if(!lat || !lon){

     showToast("Latitude ও Longitude দিন");

     return null;
   }

   return "https://www.google.com/maps?q="+
   encodeURIComponent(lat+","+lon);
 }

}


/* GENERATE */

function generateQR(){

 const text=getQRText();

 if(!text) return;


 if(typeof QRCode==="undefined"){

   showToast("QR Library লোড হয়নি");

   return;
 }


 const btn=document
 .getElementById("generateBtn");

 const loader=document
 .getElementById("loader");


 btn.disabled=true;
 loader.style.display="block";


 setTimeout(function(){

   try{

     currentQRText=text;

     currentSize=parseInt(
       document.getElementById("qrSize").value
     );


     const darkColor=document
     .getElementById("darkColor").value;

     const lightColor=document
     .getElementById("lightColor").value;


     const box=document
     .getElementById("qrcode");

     box.innerHTML="";


     box.style.width=
       (currentSize+30)+"px";

     box.style.height=
       (currentSize+30)+"px";


     new QRCode(box,{

       text:text,

       width:currentSize,

       height:currentSize,

       colorDark:darkColor,

       colorLight:lightColor,

       correctLevel:QRCode.CorrectLevel.M

     });


     document
     .getElementById("qrCard")
     .classList.add("show");


     addHistory(text,currentType);

     showToast("QR Code তৈরি হয়েছে ✓");


   }catch(error){

     console.error(error);

     showToast("QR Code তৈরি করা যায়নি");

   }


   btn.disabled=false;

   loader.style.display="none";

 },80);

}


/* HISTORY */

function addHistory(text,type){

 history.unshift({

   id:Date.now(),

   type:type,

   text:text

 });

 history=history.slice(0,10);

 localStorage.setItem(
   "qrMasterHistory",
   JSON.stringify(history)
 );

 renderHistory();

}


function renderHistory(){

 const box=document
 .getElementById("historyList");

 if(history.length===0){

   box.innerHTML=`
   <div class="empty">
   📜<br>
   এখনো কোনো QR তৈরি করা হয়নি
   </div>`;

   return;
 }


 box.innerHTML=history.map(function(item){

   return `
   <div class="history-item">

     <div class="history-text">

       <div class="history-type">
       ${getTypeName(item.type)}
       </div>

       <div class="history-value">
       ${escapeHTML(item.text)}
       </div>

     </div>

     <button
       class="delete"
       onclick="deleteHistory(${item.id})">
       🗑️
     </button>

   </div>
   `;

 }).join("");

}


function getTypeName(type){

 const names={

   url:"🔗 Website",
   text:"📝 Text",
   phone:"📞 Phone",
   email:"✉️ Email",
   wifi:"📶 Wi-Fi",
   contact:"👤 Contact",
   sms:"💬 SMS",
   whatsapp:"🟢 WhatsApp",
   location:"📍 Location"

 };

 return names[type]||"QR Code";
}


function deleteHistory(id){

 history=history.filter(function(item){

   return item.id!==id;

 });

 localStorage.setItem(
   "qrMasterHistory",
   JSON.stringify(history)
 );

 renderHistory();

 showToast("History মুছে ফেলা হয়েছে");

}


function clearHistory(){

 if(history.length===0){

   showToast("History খালি আছে");

   return;
 }

 if(confirm("সব History মুছে ফেলবেন?")){

   history=[];

   localStorage.removeItem(
     "qrMasterHistory"
   );

   renderHistory();

   showToast("History মুছে ফেলা হয়েছে");

 }

}


/* DOWNLOAD */

function downloadQR(){

 const canvas=document
 .querySelector("#qrcode canvas");

 if(!canvas){

   showToast("আগে QR তৈরি করুন");

   return;
 }


 try{

   const dataURL=canvas.toDataURL(
     "image/png"
   );

   const link=document
   .createElement("a");

   link.href=dataURL;

   link.download=
     "QR-Master-"+Date.now()+".png";

   document.body.appendChild(link);

   link.click();

   document.body.removeChild(link);

   showToast("QR Code Download হয়েছে ✓");

 }catch(error){

   console.error(error);

   showToast("Download করা যায়নি");

 }

}


/* SHARE */

async function shareQR(){

 const canvas=document
 .querySelector("#qrcode canvas");

 if(!canvas){

   showToast("আগে QR তৈরি করুন");

   return;
 }


 try{

   const blob=await new Promise(
     function(resolve){
       canvas.toBlob(
         resolve,
         "image/png"
       );
     }
   );


   const file=new File(
     [blob],
     "QR-Master.png",
     {
       type:"image/png"
     }
   );


   if(
     navigator.share &&
     navigator.canShare &&
     navigator.canShare({
       files:[file]
     })
   ){

     await navigator.share({

       title:"QR Master",

       text:"QR Code",

       files:[file]

     });

     return;
   }


   if(navigator.share){

     await navigator.share({

       title:"QR Master",

       text:currentQRText

     });

     return;
   }


   showToast(
     "এই ব্রাউজারে Share support নেই"
   );


 }catch(error){

   if(error.name!=="AbortError"){

     showToast("Share করা যায়নি");

   }

 }

}


/* COPY */

async function copyQRText(){

 if(!currentQRText){

   showToast("আগে QR তৈরি করুন");

   return;
 }


 try{

   await navigator.clipboard.writeText(
     currentQRText
   );

   showToast("QR Data Copy হয়েছে ✓");

 }catch(error){

   const area=document
   .createElement("textarea");

   area.value=currentQRText;

   area.style.position="fixed";
   area.style.left="-9999px";

   document.body.appendChild(area);

   area.select();

   document.execCommand("copy");

   document.body.removeChild(area);

   showToast("QR Data Copy হয়েছে ✓");

 }

}


/* DARK MODE */

function toggleTheme(){

 document.body.classList.toggle("dark");

 const dark=document.body
 .classList.contains("dark");

 localStorage.setItem(
   "qrMasterDark",
   dark?"1":"0"
 );

 document.getElementById(
   "themeBtn"
 ).textContent=
   dark?"☀️":"🌙";

}


if(
 localStorage.getItem("qrMasterDark")==="1"
){

 document.body.classList.add("dark");

 document.getElementById(
   "themeBtn"
 ).textContent="☀️";

}


/* HTML SECURITY */

function escapeHTML(text){

 return String(text)

 .replace(/&/g,"&amp;")

 .replace(/</g,"&lt;")

 .replace(/>/g,"&gt;")

 .replace(/"/g,"&quot;")

 .replace(/'/g,"&#039;");

}


/* TOAST */

function showToast(message){

 const toast=document
 .getElementById("toast");

 toast.textContent=message;

 toast.classList.add("show");

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(
   function(){

     toast.classList.remove("show");

   },
   2500
 );

}
