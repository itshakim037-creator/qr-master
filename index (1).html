<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#6c5ce7">
<title>QR Master - QR Code Generator</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
}

body{
  background:#f5f7fb;
  color:#182033;
  min-height:100vh;
}

body.dark{
  background:#0b1020;
  color:#f8fafc;
}

.app{
  width:100%;
  max-width:520px;
  margin:auto;
  min-height:100vh;
  padding-bottom:35px;
}

.header{
  background:linear-gradient(135deg,#6c5ce7,#4834d4);
  color:white;
  padding:22px 18px 26px;
  border-radius:0 0 30px 30px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:15px;
  background:white;
  color:#6c5ce7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:bold;
}

.brand h1{
  font-size:23px;
}

.brand p{
  font-size:12px;
  opacity:.85;
  margin-top:3px;
}

.theme{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  color:white;
  font-size:20px;
  cursor:pointer;
}

.intro{
  margin-top:20px;
}

.intro h2{
  font-size:25px;
}

.intro p{
  margin-top:5px;
  font-size:13px;
  opacity:.85;
}

.content{
  padding:18px 15px;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:15px;
}

.tab{
  border:0;
  padding:12px 5px;
  border-radius:12px;
  background:white;
  color:#4b5563;
  font-size:12px;
  cursor:pointer;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.dark .tab{
  background:#172036;
  color:#cbd5e1;
}

.tab.active{
  background:#6c5ce7;
  color:white;
}

.panel{
  background:white;
  border-radius:22px;
  padding:18px;
  box-shadow:0 6px 22px rgba(0,0,0,.07);
}

.dark .panel{
  background:#151d32;
  box-shadow:none;
}

.type{
  display:none;
}

.type.active{
  display:block;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #dce2ec;
  border-radius:12px;
  padding:13px;
  margin-bottom:13px;
  outline:none;
  background:#fafbfe;
  color:#182033;
  font-size:14px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.dark input,
.dark textarea,
.dark select{
  background:#0f172a;
  color:white;
  border-color:#334155;
}

.generate{
  width:100%;
  border:0;
  padding:15px;
  border-radius:13px;
  background:linear-gradient(135deg,#6c5ce7,#4834d4);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.generate:active,
.action:active{
  transform:scale(.98);
}

.qr-card{
  display:none;
  margin-top:16px;
  background:white;
  border-radius:22px;
  padding:20px;
  text-align:center;
  box-shadow:0 6px 22px rgba(0,0,0,.07);
}

.dark .qr-card{
  background:#151d32;
}

.qr-card.show{
  display:block;
}

.qr-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:14px;
}

#qrcode{
  width:230px;
  height:230px;
  margin:auto;
  padding:10px;
  background:white;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
}

#qrcode img,
#qrcode canvas{
  width:210px !important;
  height:210px !important;
  max-width:210px;
  max-height:210px;
  display:block;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.action{
  border:0;
  padding:12px;
  border-radius:11px;
  font-weight:bold;
  cursor:pointer;
  background:#eef2ff;
  color:#4c1d95;
}

.dark .action{
  background:#252f49;
  color:#ddd6fe;
}

.history{
  margin-top:20px;
}

.history-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.history-head h2{
  font-size:18px;
}

.clear{
  border:0;
  background:#fee2e2;
  color:#dc2626;
  padding:8px 11px;
  border-radius:9px;
  font-size:12px;
  cursor:pointer;
}

.history-item{
  background:white;
  border-radius:14px;
  padding:12px;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.dark .history-item{
  background:#151d32;
}

.history-text{
  max-width:75%;
  overflow:hidden;
}

.history-type{
  font-weight:bold;
  font-size:13px;
}

.history-value{
  color:#64748b;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:3px;
}

.delete{
  border:0;
  background:none;
  color:#ef4444;
  font-size:17px;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:25px;
  color:#94a3b8;
  background:white;
  border-radius:14px;
}

.dark .empty{
  background:#151d32;
}

.footer{
  text-align:center;
  color:#94a3b8;
  font-size:11px;
  margin-top:25px;
  line-height:1.6;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(80px);
  background:#111827;
  color:white;
  padding:12px 18px;
  border-radius:30px;
  font-size:13px;
  opacity:0;
  transition:.3s;
  z-index:9999;
  pointer-events:none;
}

.toast.show{
  transform:translateX(-50%) translateY(0);
  opacity:1;
}

@media(max-width:360px){
  .tabs{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

<header class="header">

  <div class="top">

    <div class="brand">

      <div class="logo">▦</div>

      <div>
        <h1>QR Master</h1>
        <p>Smart QR Code Generator</p>
      </div>

    </div>

    <button
      class="theme"
      onclick="toggleTheme()"
      id="themeBtn">
      🌙
    </button>

  </div>

  <div class="intro">
    <h2>আপনার QR Code তৈরি করুন</h2>
    <p>দ্রুত, সহজ এবং সুন্দরভাবে</p>
  </div>

</header>

<main class="content">

<div class="tabs">

  <button
    class="tab active"
    onclick="selectType('url',this)">
    🔗 Website
  </button>

  <button
    class="tab"
    onclick="selectType('text',this)">
    📝 Text
  </button>

  <button
    class="tab"
    onclick="selectType('phone',this)">
    📞 Phone
  </button>

  <button
    class="tab"
    onclick="selectType('email',this)">
    ✉️ Email
  </button>

  <button
    class="tab"
    onclick="selectType('wifi',this)">
    📶 Wi-Fi
  </button>

  <button
    class="tab"
    onclick="selectType('contact',this)">
    👤 Contact
  </button>

</div>

<div class="panel">

  <!-- URL -->

  <div class="type active" id="url">

    <label>Website URL</label>

    <input
      id="urlInput"
      type="url"
      placeholder="https://example.com">

  </div>


  <!-- TEXT -->

  <div class="type" id="text">

    <label>Your Text</label>

    <textarea
      id="textInput"
      placeholder="আপনার লেখা এখানে লিখুন..."></textarea>

  </div>


  <!-- PHONE -->

  <div class="type" id="phone">

    <label>Phone Number</label>

    <input
      id="phoneInput"
      type="tel"
      placeholder="+8801XXXXXXXXX">

  </div>


  <!-- EMAIL -->

  <div class="type" id="email">

    <label>Email Address</label>

    <input
      id="emailInput"
      type="email"
      placeholder="example@email.com">

    <label>Subject</label>

    <input
      id="emailSubject"
      type="text"
      placeholder="Email subject">

  </div>


  <!-- WIFI -->

  <div class="type" id="wifi">

    <label>Wi-Fi Name / SSID</label>

    <input
      id="wifiName"
      type="text"
      placeholder="Wi-Fi name">

    <label>Wi-Fi Password</label>

    <input
      id="wifiPassword"
      type="text"
      placeholder="Wi-Fi password">

    <label>Security</label>

    <select id="wifiSecurity">

      <option value="WPA">
        WPA/WPA2
      </option>

      <option value="WEP">
        WEP
      </option>

      <option value="nopass">
        No Password
      </option>

    </select>

    <label>

      <input
        id="wifiHidden"
        type="checkbox"
        style="width:auto;margin:0 5px 0 0">

      Hidden Network

    </label>

  </div>


  <!-- CONTACT -->

  <div class="type" id="contact">

    <label>Full Name</label>

    <input
      id="contactName"
      type="text"
      placeholder="Your name">

    <label>Phone</label>

    <input
      id="contactPhone"
      type="tel"
      placeholder="+8801XXXXXXXXX">

    <label>Email</label>

    <input
      id="contactEmail"
      type="email"
      placeholder="example@email.com">

    <label>Organization</label>

    <input
      id="contactOrg"
      type="text"
      placeholder="Company / Organization">

  </div>


  <button
    class="generate"
    onclick="generateQR()">

    ✨ Generate QR Code

  </button>

</div>


<!-- QR RESULT -->

<div class="qr-card" id="qrCard">

  <div class="qr-title">
    Your QR Code
  </div>

  <div id="qrcode"></div>

  <div class="actions">

    <button
      class="action"
      onclick="downloadQR()">

      ⬇️ Download

    </button>

    <button
      class="action"
      onclick="shareQR()">

      📤 Share

    </button>

    <button
      class="action"
      onclick="copyQRText()">

      📋 Copy

    </button>

    <button
      class="action"
      onclick="generateQR()">

      🔄 Refresh

    </button>

  </div>

</div>


<!-- HISTORY -->

<div class="history">

  <div class="history-head">

    <h2>📜 Recent QR</h2>

    <button
      class="clear"
      onclick="clearHistory()">

      Clear

    </button>

  </div>

  <div id="historyList"></div>

</div>


<div class="footer">

  QR Master © 2026

  <br>

  Create • Save • Share QR Codes

</div>

</main>

</div>


<div
  class="toast"
  id="toast">
</div>


<!-- QR CODE LIBRARY -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

let currentType = "url";

let currentQRText = "";

let history =
  JSON.parse(
    localStorage.getItem("qrMasterHistory") || "[]"
  );


/* =========================
   SELECT TYPE
========================= */

function selectType(type,button){

  currentType = type;

  document
    .querySelectorAll(".type")
    .forEach(function(el){

      el.classList.remove("active");

    });

  const selected =
    document.getElementById(type);

  if(selected){

    selected.classList.add("active");

  }

  document
    .querySelectorAll(".tab")
    .forEach(function(el){

      el.classList.remove("active");

    });

  button.classList.add("active");

}


/* =========================
   GET QR TEXT
========================= */

function getQRText(){

  /* URL */

  if(currentType === "url"){

    let value =
      document
      .getElementById("urlInput")
      .value
      .trim();

    if(!value){

      showToast("Website URL লিখুন");

      return null;

    }

    if(
      !value.startsWith("http://") &&
      !value.startsWith("https://")
    ){

      value =
        "https://" + value;

    }

    return value;

  }


  /* TEXT */

  if(currentType === "text"){

    const value =
      document
      .getElementById("textInput")
      .value
      .trim();

    if(!value){

      showToast("Text লিখুন");

      return null;

    }

    return value;

  }


  /* PHONE */

  if(currentType === "phone"){

    const value =
      document
      .getElementById("phoneInput")
      .value
      .trim();

    if(!value){

      showToast("Phone number লিখুন");

      return null;

    }

    return "tel:" + value;

  }


  /* EMAIL */

  if(currentType === "email"){

    const email =
      document
      .getElementById("emailInput")
      .value
      .trim();

    const subject =
      document
      .getElementById("emailSubject")
      .value
      .trim();

    if(!email){

      showToast("Email address লিখুন");

      return null;

    }

    return (
      "mailto:" +
      email +
      "?subject=" +
      encodeURIComponent(subject)
    );

  }


  /* WIFI */

  if(currentType === "wifi"){

    const ssid =
      document
      .getElementById("wifiName")
      .value
      .trim();

    const password =
      document
      .getElementById("wifiPassword")
      .value;

    const security =
      document
      .getElementById("wifiSecurity")
      .value;

    const hidden =
      document
      .getElementById("wifiHidden")
      .checked;

    if(!ssid){

      showToast("Wi-Fi name লিখুন");

      return null;

    }

    return (
      "WIFI:" +
      "T:" + security +
      ";S:" + escapeWifi(ssid) +
      ";P:" + escapeWifi(password) +
      ";H:" + (hidden ? "true" : "false") +
      ";;"
    );

  }


  /* CONTACT */

  if(currentType === "contact"){

    const name =
      document
      .getElementById("contactName")
      .value
      .trim();

    const phone =
      document
      .getElementById("contactPhone")
      .value
      .trim();

    const email =
      document
      .getElementById("contactEmail")
      .value
      .trim();

    const org =
      document
      .getElementById("contactOrg")
      .value
      .trim();

    if(!name && !phone && !email){

      showToast(
        "Contact information দিন"
      );

      return null;

    }

    return (
      "BEGIN:VCARD\n" +
      "VERSION:3.0\n" +
      "FN:" + name + "\n" +
      "TEL:" + phone + "\n" +
      "EMAIL:" + email + "\n" +
      "ORG:" + org + "\n" +
      "END:VCARD"
    );

  }

}


/* =========================
   WIFI ESCAPE
========================= */

function escapeWifi(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/;/g,"\\;")
    .replace(/,/g,"\\,")
    .replace(/:/g,"\\:");

}


/* =========================
   GENERATE QR
========================= */

function generateQR(){

  const text =
    getQRText();

  if(!text){

    return;

  }

  currentQRText =
    text;

  const qrBox =
    document.getElementById("qrcode");

  qrBox.innerHTML = "";

  if(typeof QRCode === "undefined"){

    showToast(
      "QR Library লোড হয়নি"
    );

    return;

  }

  new QRCode(qrBox,{

    text:text,

    width:210,

    height:210,

    colorDark:"#111827",

    colorLight:"#ffffff",

    correctLevel:
      QRCode.CorrectLevel.H

  });


  document
    .getElementById("qrCard")
    .classList.add("show");


  addHistory(
    text,
    currentType
  );


  showToast(
    "QR Code তৈরি হয়েছে ✓"
  );

}


/* =========================
   HISTORY
========================= */

function addHistory(text,type){

  history.unshift({

    id:Date.now(),

    type:type,

    text:text

  });

  history =
    history.slice(0,10);

  localStorage.setItem(
    "qrMasterHistory",
    JSON.stringify(history)
  );

  renderHistory();

}


function renderHistory(){

  const box =
    document.getElementById("historyList");

  if(history.length === 0){

    box.innerHTML = `
      <div class="empty">
        📜<br>
        এখনো কোনো QR তৈরি করা হয়নি
      </div>
    `;

    return;

  }

  box.innerHTML =
    history.map(function(item){

      return `

        <div class="history-item">

          <div class="history-text">

            <div class="history-type">
              ${getTypeName(item.type)}
            </div>

            <div class="history-value">
              ${escapeHTML(item.text)}
            </div>

          </div>

          <button
            class="delete"
            onclick="deleteHistory(${item.id})">

            🗑️

          </button>

        </div>

      `;

    }).join("");

}


function getTypeName(type){

  const names = {

    url:"🔗 Website",

    text:"📝 Text",

    phone:"📞 Phone",

    email:"✉️ Email",

    wifi:"📶 Wi-Fi",

    contact:"👤 Contact"

  };

  return names[type] ||
    "QR Code";

}


function deleteHistory(id){

  history =
    history.filter(function(item){

      return item.id !== id;

    });

  localStorage.setItem(
    "qrMasterHistory",
    JSON.stringify(history)
  );

  renderHistory();

}


function clearHistory(){

  if(history.length === 0){

    showToast(
      "History খালি আছে"
    );

    return;

  }

  if(
    confirm(
      "সব History মুছে ফেলবেন?"
    )
  ){

    history = [];

    localStorage.removeItem(
      "qrMasterHistory"
    );

    renderHistory();

    showToast(
      "History মুছে ফেলা হয়েছে"
    );

  }

}


/* =========================
   FIXED DOWNLOAD
========================= */

async function downloadQR(){

  const qrBox =
    document.getElementById("qrcode");

  if(!qrBox){

    showToast(
      "QR Code পাওয়া যায়নি"
    );

    return;

  }


  const canvas =
    qrBox.querySelector("canvas");

  const img =
    qrBox.querySelector("img");


  if(!canvas && !img){

    showToast(
      "আগে QR তৈরি করুন"
    );

    return;

  }


  try{

    let dataURL = null;


    /*
      প্রথমে Canvas থেকে PNG
    */

    if(canvas){

      dataURL =
        canvas.toDataURL(
          "image/png"
        );

    }


    /*
      Image fallback
    */

    else if(img){

      const tempCanvas =
        document.createElement(
          "canvas"
        );

      const width =
        img.naturalWidth ||
        210;

      const height =
        img.naturalHeight ||
        210;

      tempCanvas.width =
        width;

      tempCanvas.height =
        height;


      const ctx =
        tempCanvas.getContext(
          "2d"
        );


      ctx.fillStyle =
        "#ffffff";

      ctx.fillRect(
        0,
        0,
        width,
        height
      );


      ctx.drawImage(
        img,
        0,
        0,
        width,
        height
      );


      dataURL =
        tempCanvas.toDataURL(
          "image/png"
        );

    }


    if(!dataURL){

      throw new Error(
        "PNG তৈরি করা যায়নি"
      );

    }


    /*
      Download
    */

    const link =
      document.createElement(
        "a"
      );

    link.href =
      dataURL;

    link.download =
      "QR-Master-" +
      Date.now() +
      ".png";

    link.style.display =
      "none";


    document.body.appendChild(
      link
    );

    link.click();


    setTimeout(function(){

      document.body.removeChild(
        link
      );

    },100);


    showToast(
      "QR Code Download হয়েছে ✓"
    );


  }catch(error){

    console.error(
      "Download Error:",
      error
    );


    /*
      শেষ fallback:
      নতুন tab-এ QR খুলবে
    */

    try{

      if(canvas){

        const data =
          canvas.toDataURL(
            "image/png"
          );

        const win =
          window.open(
            data,
            "_blank"
          );

        if(win){

          showToast(
            "QR Code খুলেছে — Save করুন"
          );

          return;

        }

      }

    }catch(e){}


    showToast(
      "Download করা যায়নি"
    );

  }

}


/* =========================
   SHARE
========================= */

async function shareQR(){

  const canvas =
    document.querySelector(
      "#qrcode canvas"
    );

  const img =
    document.querySelector(
      "#qrcode img"
    );


  if(!canvas && !img){

    showToast(
      "আগে QR তৈরি করুন"
    );

    return;

  }


  try{

    let blob;


    if(canvas){

      blob =
        await new Promise(
          function(resolve){

            canvas.toBlob(
              resolve,
              "image/png"
            );

          }
        );

    }

    else{

      const response =
        await fetch(
          img.src
        );

      blob =
        await response.blob();

    }


    const file =
      new File(
        [blob],
        "QR-Master.png",
        {
          type:"image/png"
        }
      );


    if(
      navigator.share &&
      navigator.canShare &&
      navigator.canShare({
        files:[file]
      })
    ){

      await navigator.share({

        title:"QR Master",

        text:"QR Code",

        files:[file]

      });

      showToast(
        "Share সম্পন্ন হয়েছে ✓"
      );

    }

    else if(
      navigator.share
    ){

      await navigator.share({

        title:"QR Master",

        text:currentQRText

      });

    }

    else{

      showToast(
        "এই ডিভাইসে Share support নেই"
      );

    }


  }catch(error){

    if(
      error.name !==
      "AbortError"
    ){

      showToast(
        "Share করা যায়নি"
      );

    }

  }

}


/* =========================
   COPY
========================= */

async function copyQRText(){

  if(!currentQRText){

    showToast(
      "আগে QR তৈরি করুন"
    );

    return;

  }


  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard.writeText(
        currentQRText
      );

      showToast(
        "QR data Copy হয়েছে ✓"
      );

      return;

    }


    /*
      Fallback copy
    */

    const textarea =
      document.createElement(
        "textarea"
      );

    textarea.value =
      currentQRText;

    textarea.style.position =
      "fixed";

    textarea.style.left =
      "-9999px";


    document.body.appendChild(
      textarea
    );

    textarea.focus();

    textarea.select();

    document.execCommand(
      "copy"
    );

    document.body.removeChild(
      textarea
    );


    showToast(
      "QR data Copy হয়েছে ✓"
    );


  }catch(error){

    showToast(
      "Copy করা যায়নি"
    );

  }

}


/* =========================
   DARK MODE
========================= */

function toggleTheme(){

  document.body.classList.toggle(
    "dark"
  );

  const dark =
    document.body.classList.contains(
      "dark"
    );


  localStorage.setItem(
    "qrMasterDark",
    dark ? "1" : "0"
  );


  document.getElementById(
    "themeBtn"
  ).textContent =
    dark ? "☀️" : "🌙";

}


/* =========================
   LOAD DARK MODE
========================= */

if(
  localStorage.getItem(
    "qrMasterDark"
  ) === "1"
){

  document.body.classList.add(
    "dark"
  );

  document.getElementById(
    "themeBtn"
  ).textContent =
    "☀️";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   TOAST
========================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(function(){

      toast.classList.remove(
        "show"
      );

    },2500);

}


/* =========================
   START
========================= */

renderHistory();
